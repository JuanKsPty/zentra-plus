# Configuracion de Alembic.
#
# Ojo: la URL de la base NO se pone aqui. La lee alembic/env.py desde
# app.core.config, para que haya una sola fuente de verdad y para que el
# valor del .env y el de docker compose no puedan divergir.

[alembic]
script_location = alembic
prepend_sys_path = .
# Las revisiones se ordenan solas en el listado del editor.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

# WARNING y no INFO: en INFO, el logger del engine imprime cada sentencia CON
# SUS PARAMETROS, que es la via por la que un hash de credencial acaba en un log.
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
